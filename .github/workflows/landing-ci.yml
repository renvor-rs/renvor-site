# Landing release-candidate checks.
#
# Every third-party action is pinned to a full commit SHA rather than a tag. A tag is a
# mutable pointer, so `@v4` means "whatever that account publishes next"; a SHA means the
# reviewed code. The trailing comment records which release the SHA came from, because a
# bare 40-character hash tells a reviewer nothing about whether it is current.
#
# This workflow validates. It does not publish, deploy, or authenticate anywhere: no
# registry login, no environment, no server access, and no secret beyond the automatic
# GITHUB_TOKEN that the link checker uses for GitHub API rate limits. Publication is a
# separate workflow (`publish-image.yml`) that runs only on trusted pushes to `main`.

name: landing-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only by default, and no job widens it. Nothing here writes to the repository, so
# nothing needs permission to. Publishing scan results to code scanning would require
# `security-events: write`, which is why the scanners below gate on exit code and upload
# their reports as artifacts instead.
permissions:
  contents: read

# A superseded push is not worth a runner. `main` is excluded so pushes to it always
# complete — cancelling those would leave gaps in the record.
concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Every job installs Node from `.nvmrc`, so the version lives in exactly one place and CI
  # cannot drift from what a developer gets by running `nvm use`.
  NODE_VERSION_FILE: .nvmrc
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ── Typecheck, build, and derive the policy ────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version is pinned here on purpose: the action reads `packageManager` from
      # package.json, so pnpm 11.21.0 comes from the same declaration the lockfile was
      # produced with. Stating it twice would let the two drift apart.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm

      - name: Report the resolved toolchain
        run: |
          echo "node    $(node --version)   (.nvmrc requests $(cat .nvmrc))"
          echo "pnpm    $(pnpm --version)   (packageManager pins $(node -p "require('./package.json').packageManager"))"

      # `--frozen-lockfile` makes the committed lockfile authoritative. If package.json and
      # the lockfile disagree, this fails rather than resolving something new and testing a
      # dependency tree that was never reviewed.
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Removing the generated directories first means the build cannot pass by reusing
      # output from an earlier state of the source.
      - name: Build the static export from clean generated directories
        run: |
          rm -rf .next out
          pnpm run build
          test -f out/index.html
          test -f out/404.html

      # Fails closed on the architectural boundary this site is built around: a static export
      # must contain no server. If a Server Action, route handler, or middleware ever appears,
      # `next build` emits the corresponding runtime artifacts and this catches it.
      - name: Assert the export needs no server
        run: |
          set -euo pipefail
          test ! -d out/api || { echo "::error::out/api exists — a route handler reached a static export"; exit 1; }
          for f in middleware.ts middleware.js app/api; do
            test ! -e "$f" || { echo "::error::$f exists and requires a Node server"; exit 1; }
          done
          if grep -rlE '"use server"|use server' app/ 2>/dev/null | grep -q .; then
            echo "::error::a Server Action directive was found in app/"; exit 1
          fi
          echo "static export boundary holds: no API routes, no middleware, no server actions"

      # The policy is derived from the built HTML, here, so the artifact downloaded by every
      # downstream job carries the exact policy that describes it.
      - name: Derive the Content-Security-Policy from the build
        run: |
          set -euo pipefail
          pnpm run csp
          test -s out/_csp/policy.txt
          grep -q "script-src 'self' 'sha256-" out/_csp/policy.txt
          # NOT `! grep …`. Under `set -e` a negated command does not trigger errexit
          # (shellcheck SC2251), so the weak-policy case would have printed nothing and passed —
          # a gate that fails open is worse than no gate, because it reads as evidence.
          if grep -qE "unsafe-inline|unsafe-eval|unsafe-hashes" out/_csp/policy.txt; then
            echo "::error::the generated policy contains an unsafe directive"
            cat out/_csp/policy.txt
            exit 1
          fi
          echo "policy: $(cat out/_csp/policy.txt)"

      - name: Report the shipped bundle size
        run: |
          echo "initial JS referenced by index.html:"
          node -e '
            const fs=require("fs"), path=require("path");
            const html=fs.readFileSync("out/index.html","utf8");
            const srcs=[...new Set([...html.matchAll(/<script[^>]*\ssrc="([^"]+)"/g)].map(m=>m[1]))];
            let total=0;
            for (const s of srcs.sort()) { const f=path.join("out",s); if(fs.existsSync(f)){ const n=fs.statSync(f).size; total+=n; console.log(`  ${(n/1024).toFixed(1).padStart(8)} KB  ${s}`);} }
            console.log(`  ${"-".repeat(10)}\n  ${(total/1024).toFixed(1).padStart(8)} KB initial JS`);
          '

      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: out
          retention-days: 30
          if-no-files-found: error

  # ── Accessibility ──────────────────────────────────────────────────────────────────
  accessibility:
    name: accessibility
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The browser build is keyed to the Playwright version, so the cache is only reused
      # while it is genuinely the same browser.
      - name: Restore the Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Scanned against the built artifact from the `build` job, not a fresh local build, so
      # accessibility is asserted about the same bytes that were typechecked and built.
      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: out

      # Covers desktop 1440x900 and mobile 390x844, the landing route before and after
      # scroll, all four solution tab panels, every evaluation-lens state, both themes, the
      # 404 document, five reflow widths, and 200% zoom. Zero WCAG 2.1 A/AA violations are
      # tolerated.
      - name: Run the accessibility and motion suites
        run: pnpm exec playwright test --project=desktop-1440x900 --project=mobile-390x844

      - name: Upload the accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-report
          path: |
            playwright-report
            test-results
          retention-days: 30
          if-no-files-found: ignore

  # ── Content-Security-Policy across three engines ───────────────────────────────────
  csp:
    name: csp
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Restore the Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium, Firefox, and WebKit
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: out

      # THE NEGATIVE CONTROL RUNS FIRST, and deliberately so.
      #
      # Every "zero violations" result below is also what a page returns when no policy is
      # applied at all — those two states are indistinguishable from the outside. This step
      # injects an inline script whose hash is absent from the policy and requires the browser
      # to both report AND refuse it. If this step fails, every clean result in this job is
      # meaningless, so it gates them rather than following them.
      - name: Negative control — prove enforcement is live
        env:
          CSP_CONTROL: '1'
          CSP_MODE: enforce
        run: pnpm exec playwright test --project=csp-control

      - name: Enforcement across Chromium, Firefox, and WebKit
        env:
          CSP_MODE: enforce
        # `--workers=1` for the engine matrix, deliberately.
        #
        # Firefox and WebKit are software-rendered on a CI runner. Run two at once and a
        # navigation on a 1.9 MB site intermittently exceeded even a 90-second budget — a
        # different test each run, always `page.goto`, never on Chromium. Measured serially the
        # same suite passes in ~30s. That is contention for a shared CPU, not a property of the
        # page, and the honest response is to stop creating the contention rather than to add
        # retries until it goes green. `retries` stays at 0.
        run: pnpm exec playwright test --workers=1 --project=chromium --project=firefox --project=webkit

      # Report-Only is validated too, because that is the mode a policy is rolled out in and a
      # policy that only works when enforced is not one anybody can safely stage.
      - name: Report-Only across Chromium, Firefox, and WebKit
        env:
          CSP_MODE: report-only
        run: pnpm exec playwright test --workers=1 --project=chromium --project=firefox --project=webkit

      - name: Publish the policy as evidence
        if: ${{ !cancelled() }}
        run: |
          echo '### Content-Security-Policy' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat out/_csp/policy.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the CSP evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csp-evidence
          path: |
            out/_csp
            playwright-report
            test-results
          retention-days: 30
          if-no-files-found: ignore

  # ── Link checking ──────────────────────────────────────────────────────────────────
  links:
    name: links
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: out

      # `fail` defaults to true in this release and is stated anyway, because a link checker
      # that does not fail the build is a report nobody reads. `failIfEmpty` is the positive
      # control: if the glob ever stops matching, an empty run must be a failure rather than a
      # silent pass. `--root-dir` must be absolute, which is why it is passed here rather than
      # committed into lychee.toml.
      - name: Check links in the built output
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          failIfEmpty: true
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/out
            --no-progress
            out/**/*.html

  # ── Dependency advisories ──────────────────────────────────────────────────────────
  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The package manager's own advisory database, gated at moderate. This is the check that
      # would have caught the `image-size` advisories the Docusaurus tree carried, and it is
      # deliberately separate from Trivy: they draw on different sources.
      - name: pnpm advisories
        run: pnpm audit --audit-level=moderate

      # The runtime image is a scratch image holding static files, one static binary, and a
      # config file, so it has no OS package database and no dependency manifest — the image
      # scan below has almost nothing to look at, by design. The dependency tree that produces
      # the site is where advisories actually live, so it is scanned directly. Exceptions live
      # in .trivyignore.yaml, each with a stated reason and an expiry date.
      - name: Scan the dependency tree
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          skip-dirs: node_modules,out,.next
          format: table

      # The runtime SBOM is empty by construction, so this is the one that carries the
      # inventory. This job never installs into the scanned path, so Syft catalogues from
      # pnpm-lock.yaml rather than from a node_modules tree.
      # sbom-action writes `output-file` without creating its parent, so the directory has to
      # exist first or the step fails with ENOENT after Syft has already done the work.
      - name: Create the SBOM output directory
        run: mkdir -p sbom

      - name: Generate the dependency SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom/renvor-site-dependencies.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          dependency-snapshot: false

      - name: Upload the dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-sbom
          path: sbom/renvor-site-dependencies.spdx.json
          retention-days: 30
          if-no-files-found: error

  # ── Container ──────────────────────────────────────────────────────────────────────
  container:
    name: container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Normalises timestamps written into the image so two builds of the same commit are
      # comparable. Taken from the commit itself rather than the clock.
      - name: Build the production image
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
          docker build --file Dockerfile --tag renvor-site:ci .

      - name: Report the image size and configuration
        run: |
          docker image inspect renvor-site:ci \
            --format 'size={{.Size}} user={{.Config.User}} entrypoint={{.Config.Entrypoint}} exposed={{.Config.ExposedPorts}}'

      # Proves the runtime holds the generated site, the server binary, and the generated
      # configuration — and nothing else. This is an assertion rather than a printout: if
      # source, a package manager, or a shell ever reaches the shipped layer, the job fails.
      #
      # The image's own layers are inspected rather than `docker export`, because export
      # materialises the daemon's mounts (/proc, /sys, /dev, /etc/hosts) that are not part of
      # the image — checking those would mean allow-listing paths that were never shipped.
      # This is an allow-list, not a list of things to look out for: anything unexpected fails.
      - name: Assert the runtime contains static output only
        run: |
          set -euo pipefail
          docker save renvor-site:ci -o /tmp/image.tar
          rm -rf /tmp/imgx && mkdir -p /tmp/imgx
          tar -xf /tmp/image.tar -C /tmp/imgx
          python3 - <<'PY'
          import json, os, sys, tarfile

          root = "/tmp/imgx"
          blob = lambda d: os.path.join(root, "blobs", *d.split(":"))
          manifest = json.load(open(blob(json.load(open(f"{root}/index.json"))["manifests"][0]["digest"])))
          if "manifests" in manifest:
              # Skip the attestation manifest; take the one that actually has layers.
              for m in manifest["manifests"]:
                  if m.get("annotations", {}).get("vnd.docker.reference.type") == "attestation-manifest":
                      continue
                  candidate = json.load(open(blob(m["digest"])))
                  if "layers" in candidate:
                      manifest = candidate
                      break

          entries = []
          for layer in manifest["layers"]:
              with tarfile.open(blob(layer["digest"])) as t:
                  entries += [n.rstrip("/") for n in t.getnames() if n.strip("/")]

          top = sorted({e.split("/")[0] for e in entries})
          allowed = {"public", "static-web-server", "config.toml"}
          print(f"layers={len(manifest['layers'])} entries={len(entries)} top-level={top}")

          unexpected = sorted(set(top) - allowed)
          if unexpected:
              print(f"::error::runtime image contains unexpected top-level paths: {unexpected}")
              sys.exit(1)
          if not any(e.startswith("public/") for e in entries):
              print("::error::runtime image contains no site output under /public")
              sys.exit(1)
          if "static-web-server" not in top:
              print("::error::runtime image contains no server binary")
              sys.exit(1)
          if "config.toml" not in top:
              print("::error::runtime image contains no generated configuration")
              sys.exit(1)
          if not any(e.startswith("public/_csp/") for e in entries):
              print("::error::runtime image does not carry its own CSP evidence")
              sys.exit(1)
          print("runtime contains only the generated site, the server binary, and its configuration")
          PY

      # Runs the image the way it is meant to run: unprivileged user, every capability
      # dropped, and a read-only root filesystem with no tmpfs. If the server needed to write
      # anywhere, this would fail rather than quietly requiring a writable layer in production.
      - name: Smoke-test the runtime under production constraints
        run: |
          set -euo pipefail
          docker run -d --name renvor-smoke \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 65532:65532 \
            -p 18080:8080 renvor-site:ci
          for _ in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health)" = "200" ]; then
              ready=1; break
            fi
            sleep 1
          done
          [ "${ready:-0}" = "1" ] || { echo "::error::/health never returned 200"; docker logs renvor-smoke; exit 1; }
          echo "health      $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health)"
          echo "index       $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)"
          echo "missing     $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/does-not-exist)"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = "200" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/does-not-exist)" = "404" ]

      # The image must serve the policy that describes its OWN bytes. Comparing against a
      # committed copy would only prove the copy matched; this hashes every inline script in
      # the HTML the container actually served and requires each to be authorised.
      - name: Assert the served policy authorises the served HTML
        run: |
          set -euo pipefail
          curl -s http://127.0.0.1:18080/ -o /tmp/c-index.html
          curl -s http://127.0.0.1:18080/404.html -o /tmp/c-404.html
          POLICY="$(curl -s -o /dev/null -D - http://127.0.0.1:18080/ \
            | tr -d '\r' | sed -n 's/^[Cc]ontent-[Ss]ecurity-[Pp]olicy: //p')"
          [ -n "$POLICY" ] || { echo "::error::the container served no CSP header"; exit 1; }
          echo "$POLICY"
          node -e '
            const {createHash}=require("crypto"), fs=require("fs");
            const policy=process.argv[1];
            let ok=true, total=0;
            for (const f of ["/tmp/c-index.html","/tmp/c-404.html"]) {
              const html=fs.readFileSync(f,"utf8");
              for (const m of html.matchAll(/<script(?![^>]*\ssrc=)[^>]*>([\s\S]*?)<\/script>/gi)) {
                total++;
                const h="'"'"'sha256-"+createHash("sha256").update(m[1],"utf8").digest("base64")+"'"'"'";
                const hit=policy.includes(h);
                if(!hit) ok=false;
                console.log(`  ${hit?"AUTHORISED":"MISSING   "} ${h} ${f}`);
              }
            }
            console.log(`  ${total} inline scripts`);
            if(!ok){ console.log("::error::the image serves a policy that does not authorise its own HTML"); process.exit(1); }
          ' "$POLICY"
          docker rm -f renvor-smoke >/dev/null

      - name: Scan the runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: renvor-site:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          format: table

      # Generated from the image rather than from the lockfile, so it describes what is
      # actually shipped. Expect it to catalogue almost nothing: the runtime is a scratch image
      # holding static files and one statically linked binary, so there is genuinely little to
      # inventory. That is the honest result, and it is why the `dependencies` job also
      # produces an SBOM of the tree that built the site.
      - name: Create the SBOM output directory
        run: mkdir -p sbom

      - name: Generate the runtime SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: renvor-site:ci
          format: spdx-json
          output-file: sbom/renvor-site.spdx.json
          # Pinned rather than left to the action's default, so CI produces the SBOM with the
          # same Syft that was validated locally.
          syft-version: v1.51.0
          upload-artifact: false
          dependency-snapshot: false

      - name: Upload the SBOM
