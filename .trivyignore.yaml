# Trivy exceptions.
#
# **This file is deliberately empty of exceptions, and that is the whole point of recording it
# rather than deleting it.**
#
# It previously carried two entries — CVE-2025-71329 and CVE-2025-71330, both denial-of-service
# advisories against `image-size@2.0.2`, reached through `@docusaurus/mdx-loader`. Neither had a
# published fix, so they were accepted risks with an expiry rather than deferred upgrades, and
# they were tracked as Phase 001 deployment gate **T108**.
#
# The Next.js migration removed them by removing the dependency: `image-size` no longer appears
# anywhere in `pnpm-lock.yaml`, and `pnpm audit` reports no known vulnerabilities across the
# whole tree. The exceptions were retired because the risk was eliminated, not because it was
# re-judged.
#
# WHAT BELONGS HERE, IF ANYTHING EVER DOES
#
# Every entry must be a HIGH or CRITICAL finding that has been looked at, judged, and given an
# expiry date. Nothing goes here to make a build green. An entry that cannot state why the risk
# does not apply does not belong in this file — the fix is to upgrade, replace, or remove the
# dependency instead.
#
# Entries expire on purpose. When one lapses the scan turns red again and the judgement gets
# re-made against whatever is true then, rather than quietly outliving its evidence.
#
# The file itself is kept rather than deleted so that both CI workflows can keep referencing a
# path that exists, and so the next person to reach for an exception reads the rules first.

vulnerabilities: []
